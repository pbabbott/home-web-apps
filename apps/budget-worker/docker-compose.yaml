services:
  budget-worker:
    image: harbor.local.abbottland.io/library/budget-worker:smoke
    profiles:
      - smoke
    build:
      context: ../../
      dockerfile: apps/budget-worker/Dockerfile
      args:
        BASE_IMAGE: harbor.local.abbottland.io/library/budget-worker-base:smoke
    ports:
      - '4006:4006'
    environment:
      - PORT=4006
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=budget
      - POSTGRES_USER=budget
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Password123}
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:4006/healthz']
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 4s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: budget-worker-postgres
    ports:
      - '5433:5432'
    environment:
      - POSTGRES_DB=budget
      - POSTGRES_USER=budget
      # Default password for local development, see docker-compose environment overrides above.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Password123}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U budget -d budget']
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 4s
