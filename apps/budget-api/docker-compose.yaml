services:
  budget-api:
    image: harbor.local.abbottland.io/library/budget-api:smoke
    profiles:
      - smoke
    build:
      context: ../../
      dockerfile: docker/pnpm-turbo.Dockerfile
      args:
        BASE_IMAGE: harbor.local.abbottland.io/library/node-22-alpine:1.0.0
        PROJECT_DIR: apps/
        PROJECT: budget-api
    ports:
      - '4005:4005'
    environment:
      - PORT=4005
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=budget
      - POSTGRES_USER=budget
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Password123}
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:4005/healthz']
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 4s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: budget-api-postgres
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_DB=budget
      - POSTGRES_USER=budget
      # Default password for local development, see docker-compose environment overrides above.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Password123}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U budget -d budget']
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 4s
