baseConfig: ./abctl.base.yml
build:
  dockerfile: Dockerfile
  context: .
  buildCache: harbor.local.abbottland.io/build-cache
secrets:
  generateEnv: true
  envFile: .env
  envSampleFile: sample.env
  onePassword:
    vault: Homelab
    items:
      - secretName: exodus-credential-key
        secretKey: EXODUS_CREDENTIAL_KEY
        envVarName: EXODUS_CREDENTIAL_KEY
