baseConfig: ./abctl.base.yml
build:
  dockerfile: Dockerfile
  context: .
  buildCache: harbor.local.abbottland.io/build-cache
secrets:
  generateEnv: true
  envFile: .env
  envSampleFile: sample.env
  onePassword:
    vault: Homelab
    items:
      - secretName: SONARR_API_KEY
        secretKey: API_KEY
        envVarName: SONARR_API_KEY
